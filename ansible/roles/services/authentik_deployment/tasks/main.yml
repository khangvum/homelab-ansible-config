---
# Reference: https://docs.goauthentik.io/install-config/install/docker-compose/
- name: Linux Variables Load
  ansible.builtin.include_vars:
    file: ../../../variables/os_var/linux_var.yml

- name: Authentik Directory Structures Creation
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0777'
  loop:
    - "{{ authentik_parent_dir }}"
    - "{{ authentik_parent_dir }}/postgres_data"
    - "{{ authentik_parent_dir }}/redis_data"
    - "{{ authentik_parent_dir }}/data"
    - "{{ authentik_parent_dir }}/templates"

- name: Docker Compose File Creation
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_parent_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  register: docker_compose_file

- name: Authentik Deployment
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_parent_dir }}"
    pull: "{{ docker_image_pull_action }}"
    state: present
    remove_orphans: true