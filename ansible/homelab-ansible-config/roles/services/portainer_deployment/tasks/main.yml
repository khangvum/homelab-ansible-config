---
# Reference: https://docs.portainer.io/start/install-ce/server/docker/linux
- name: Linux Variables Load
  ansible.builtin.include_vars:
    file: ../../../variables/os_var/linux_var.yml

- name: portainer Directory Creation
  ansible.builtin.file:
    path: "{{ portainer_parent_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Docker Compose File Creation
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_parent_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  register: docker_compose_file

- name: Portainer Image Name Definition Based on the Host
  ansible.builtin.set_fact:
    portainer_image_name: "{{ 'portainer/portainer-ce' if inventory_hostname == 'KVM-MGMT01' else 'portainer/agent' }}"

- name: Portainer Deployment
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_parent_dir }}"
    pull: "{{ docker_image_pull_action }}"
    state: present
    remove_orphans: true
