---
# Reference: https://docs.goauthentik.io/install-config/install/docker-compose/
- name: Linux Variables Load
  ansible.builtin.include_vars:
    file: ../../../variables/os_var/linux_var.yml

- name: Authentik Directory Structures Creation
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0777'
  loop:
    - "{{ authentik_parent_dir }}"
    - "{{ authentik_parent_dir }}/postgres_data"
    - "{{ authentik_parent_dir }}/redis_data"
    - "{{ authentik_parent_dir }}/media"
    - "{{ authentik_parent_dir }}/templates"

- name: Docker Compose File Creation
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_parent_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  register: docker_compose_file

- name: Authentik Latest Image Pull If Available
  community.docker.docker_image:
    name: "ghcr.io/goauthentik/server"
    source: pull
  register: authentik_image_pull

- name: Authentik Deployment
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ authentik_parent_dir }}"
  when: >
    docker_compose_file.changed or 
    authentik_image_pull.changed